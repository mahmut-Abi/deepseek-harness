services:
  dsh-web:
    build: .
    network_mode: host
    environment:
      DSH_PORT: ${DSH_PORT:-3080}
      DSH_PUBLIC_HOST: dsh.85685856.xyz
      DSH_TRUSTED_HOSTS: dsh.85685856.xyz
      LAN_IP: ${LAN_IP:-}
      DSH_AUTH_USERNAME: ${DSH_AUTH_USERNAME:-admin}
      DSH_AUTH_PASSWORD: ${DSH_AUTH_PASSWORD:-DshAuthChangeMe2026}
      DSH_AUTH_COOKIE_SECURE: ${DSH_AUTH_COOKIE_SECURE:-true}
      DSH_AUTH_TOKEN: ${DSH_AUTH_TOKEN:-}
    volumes:
      - dsh-data:/root/.dsh
      - dsh-workspace:/workspec

volumes:
  dsh-data:
  dsh-workspace:
